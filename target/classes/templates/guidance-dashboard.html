<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guidance Counselor Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">

    <nav class="bg-purple-900 p-4 text-white flex justify-between items-center shadow-md">
        <div class="font-bold text-xl"><i class="fas fa-user-shield mr-2"></i> Guidance Counselor Portal</div>
        <div>
            <span class="mr-4" th:text="${userName}">Counselor</span>
            <a href="/logout" class="bg-red-600 px-4 py-2 rounded text-sm hover:bg-red-700">Logout</a>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        
        <div th:if="${param.success}" class="mb-4 p-4 bg-purple-100 text-purple-800 border border-purple-300 rounded shadow">
            Action completed! System compliance records updated successfully.
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
            <div class="bg-white p-6 rounded-lg shadow border lg:col-span-1">
                <h2 class="text-lg font-bold mb-4 border-b pb-2 text-purple-800">Log Student Case / Infraction</h2>
                <form action="/guidance/log-case" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Student LRN</label>
                        <input type="number" name="studentLrn" required class="w-full border p-2 rounded mt-1 focus:ring-purple-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Case / Classification Type</label>
                        <select name="infractionType" required class="w-full border p-2 rounded mt-1 focus:ring-purple-500">
                            <option value="" disabled selected>-- Select Type --</option>
                            <option value="Tardiness / Chronic Absences">Tardiness / Chronic Absences</option>
                            <option value="Uniform / Dress Code Violation">Uniform / Dress Code Violation</option>
                            <option value="Conduct Misbehavior / Fighting">Conduct Misbehavior / Fighting</option>
                            <option value="Academic Dishonesty">Academic Dishonesty</option>
                            <option value="Routine Counseling Session">Routine Counseling Session</option>
                            <option value="Parent-Teacher Consultation">Parent-Teacher Consultation</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700">Case Incident Details</label>
                        <textarea name="details" rows="4" required placeholder="Describe case, actions taken, or agreements built..." class="w-full border p-2 rounded mt-1 text-sm focus:ring-purple-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-purple-800 text-white font-bold py-2 rounded hover:bg-purple-900 transition duration-200">
                        Record Behavior Liability
                    </button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow border lg:col-span-2">
                <h2 class="text-lg font-bold mb-4 border-b pb-2 text-purple-800">Active Behavior Cases & Holds</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-sm">
                                <th class="p-3">Student Identity</th>
                                <th class="p-3">Classification</th>
                                <th class="p-3">Case Narrative</th>
                                <th class="p-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="incident : ${activeCases}" class="border-b text-sm hover:bg-gray-50">
                                <td class="p-3">
                                    <span class="font-bold block text-gray-800" th:text="${incident.studentName}"></span>
                                    <span class="text-xs text-gray-500" th:text="${'LRN: ' + incident.studentLrn}"></span>
                                </td>
                                <td class="p-3">
                                    <span class="px-2 py-1 rounded text-xs bg-red-100 text-red-800 font-semibold" th:text="${incident.infractionType}"></span>
                                </td>
                                <td class="p-3 text-xs text-gray-600 max-w-xs truncate" th:text="${incident.details}">Details</td>
                                <td class="p-3 text-right">
                                    <form action="/guidance/resolve-case" method="POST">
                                        <input type="hidden" name="recordId" th:value="${incident.id}">
                                        <button type="submit" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded hover:bg-green-700 font-bold transition duration-150">
                                            Mark Resolved
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(activeCases)}">
                                <td colspan="4" class="p-6 text-center text-gray-500 italic"><i class="fas fa-check-circle text-green-500 mr-1"></i> No active behavior holds or infractions open!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

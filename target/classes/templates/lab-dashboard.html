<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory Dashboard | LINHS Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #0d0d0d;
            --panel-bg: #161616;
            --border-color: #2a2a2a;
            --mint-green: #20c997;
            --mint-hover: #1aa078;
            --text-main: #ffffff;
            /* Crisp absolute white */
            --text-muted: #b5b5b5;
            /* Lightened from dark gray to prevent fading */
            --input-bg: #0a0a0a;
            --accent-orange: #ff9800;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .navbar {
            background-color: var(--dark-bg) !important;
            border-bottom: 1px solid var(--border-color);
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .panel-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-control,
        .form-select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main) !important;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: var(--input-bg);
            border-color: var(--mint-green);
            color: var(--text-main) !important;
            box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25);
        }

        /* Forces clean dropdown background and white name text */
        .form-select option {
            background-color: var(--panel-bg) !important;
            color: var(--text-main) !important;
        }

        .btn-mint {
            background-color: var(--mint-green);
            color: #fff !important;
            font-weight: 600;
        }

        .btn-mint:hover {
            background-color: var(--mint-hover);
            color: #fff !important;
        }

        .table {
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: var(--text-muted) !important;
            border-bottom-width: 2px;
        }

        .table tbody td {
            color: var(--text-main) !important;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        .section-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .section-btn.active {
            background-color: rgba(32, 201, 151, 0.1);
            border-color: var(--mint-green);
            color: var(--mint-green);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="fas fa-flask text-warning fs-4"></i>
                <span class="fw-bold tracking-tight">LINHS <span
                        class="text-warning text-xs font-mono">LABORATORY</span></span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="text-end d-none d-md-block">
                    <div class="text-sm font-semibold text-white" th:text="${adminName}">Laboratory Admin</div>
                    <div class="text-xs text-muted">Science Lab Custodian</div>
                </div>
                <a href="/logout" onclick="return confirm('Are you sure you want to logout?')" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show bg-opacity-10 text-success border border-success"
            role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}">Success message.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="panel-card">
                    <h5 class="mb-4 font-bold text-lg d-flex align-items-center gap-2"
                        style="color: var(--mint-green);">
                        <i class="fas fa-plus-circle"></i> Log Equipment Liability
                    </h5>
                    <form th:action="@{/lab/log}" method="POST">
                        <input type="hidden" id="labLrn" name="lrn" required />
                        <input type="hidden" id="labStudentName" name="studentName" required />
                        
                        <div class="mb-3">
                            <label class="form-label text-xs font-semibold" style="color: var(--text-muted);">Search Student by Name</label>
                            <input type="text" id="labStudentSearch" class="form-control" 
                                placeholder="Type student name or LRN..." 
                                oninput="filterLabStudents(this.value)">
                            <div id="labStudentDropdown" class="mt-2" style="display: none; max-height: 200px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; background-color: var(--input-bg);">
                            </div>
                        </div>
                        
                        <div id="labSelectedStudent" class="mb-3 p-2 rounded" style="background-color: rgba(32, 201, 151, 0.1); border: 1px solid var(--border-color); display: none;">
                            <small style="color: var(--text-muted);">Selected:</small>
                            <div id="labSelectedName" style="color: var(--mint-green); font-weight: 600;"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-xs font-semibold" style="color: var(--text-muted);">Equipment Accountability
                                Liabilities</label>
                            <textarea name="equipmentDetails" class="form-control" rows="4"
                                placeholder="Specify laboratory apparatus, components, unreturned kits or items..."
                                required></textarea>
                        </div>
                        <button type="submit" class="btn btn-mint w-100 py-2"><i
                                class="fas fa-exclamation-triangle me-1"></i> File Lab Liability</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="m-0 fw-bold tracking-tight text-white">Active Laboratory Liability Matrix</h4>
                    <div class="d-flex gap-2">
                        <button class="section-btn active" id="btn-active" onclick="showSection('active')">Pending
                            Liabilities</button>
                    </div>
                </div>

                <div class="panel-card student-table-container" id="table-active">
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle m-0">
                            <thead>
                                <tr>
                                    <th>LRN</th>
                                    <th>Student Name</th>
                                    <th>Equipment Accountability Liabilities</th>
                                    <th>Logged At</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${activeBorrows}">
                                    <td class="font-mono text-xs fw-bold" th:text="${log.lrn}"></td>
                                    <td class="text-white fw-semibold" th:text="${log.studentName}"></td>
                                    <td th:text="${log.equipmentDetails}"></td>
                                    <td>
                                        <span class="badge bg-info"
                                            th:text="${log.loggedAt != null ? #temporals.format(log.loggedAt, 'yyyy-MM-dd | hh:mm a') : 'N/A'}"></span>
                                    </td>
                                    <td>
                                        <form th:action="@{/lab/clear}" method="POST">
                                            <input type="hidden" name="id" th:value="${log.id}" />
                                            <button type="submit" class="btn btn-sm btn-outline-success"><i
                                                    class="fas fa-check me-1"></i> Clear Liability</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(activeBorrows)}">
                                    <td colspan="5" class="text-muted py-4 text-center">No pending laboratory equipment
                                        liabilities.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const labStudents = [
            <th:block th:each="student : ${students}">
            { name: [[${student.name}]], lrn: [[${student.lrn}]] },
            </th:block>
        ];

        function filterLabStudents(query) {
            const dropdown = document.getElementById('labStudentDropdown');
            
            if (query.trim() === '') {
                dropdown.style.display = 'none';
                return;
            }

            const filtered = labStudents.filter(student => 
                student.name.toLowerCase().includes(query.toLowerCase()) || 
                student.lrn.toLowerCase().includes(query.toLowerCase())
            );

            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="p-2" style="color: var(--text-muted);">No students found</div>';
                dropdown.style.display = 'block';
                return;
            }

            dropdown.innerHTML = filtered.map(student => `
                <div class="p-2" style="border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--text-main);" 
                     onmouseover="this.style.backgroundColor = 'rgba(32, 201, 151, 0.1)'" 
                     onmouseout="this.style.backgroundColor = 'transparent'"
                     onclick="selectLabStudent('${student.lrn}', '${student.name}')">
                    <div style="font-weight: 600;">${student.name}</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">${student.lrn}</div>
                </div>
            `).join('');
            dropdown.style.display = 'block';
        }

        function selectLabStudent(lrn, name) {
            document.getElementById('labLrn').value = lrn;
            document.getElementById('labStudentName').value = name;
            document.getElementById('labStudentSearch').value = name + ' (' + lrn + ')';
            document.getElementById('labSelectedName').textContent = name + ' - ' + lrn;
            document.getElementById('labSelectedStudent').style.display = 'block';
            document.getElementById('labStudentDropdown').style.display = 'none';
        }

        function showSection(sectionId) {
            document.querySelectorAll('.student-table-container').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.section-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('table-' + sectionId).style.display = 'block';
            document.getElementById('btn-' + sectionId).classList.add('active');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('labStudentDropdown');
            const input = document.getElementById('labStudentSearch');
            if (event.target !== input && !dropdown.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });
    </script>
</body>

</html>
